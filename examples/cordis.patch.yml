# Ready-to-paste patch entry for dsh-windows-notifier.
#
# Put this in ONE of:
#   $DSH_HOME/profiles/<profile>/cordis.patch.yml   -> that profile only
#   $DSH_HOME/cordis.patch.yml                      -> every profile on this machine
#
# A profile with `patchReload: live` picks the change up without a restart.
# Every key under `config:` is optional; the commented values are the defaults.

- insert:
    - id: windows-notifier
      name: 'dsh-windows-notifier'
      config:
        # enabled: true
        # notifyOnActivate: false        # set true once to prove the channel works
        # includeSubagents: false        # notify for subagent/workflow child sessions too
        # notifyOnComplete: true
        # notifyOnQuestion: true
        # notifyOnApproval: true
        # notifyOnError: true
        # notifyOnInterrupted: false
        # minTaskDurationMs: 0           # e.g. 5000 to skip short turns
        # sound: default                 # default | silent
        # disappearAfterMs: 6000         # 0 = stay on screen until dismissed (scenario="reminder")
        # openOnClick: true              # false makes the toast inert
        # launchUrl: 'http://127.0.0.1:3080'   # default: the running Web GUI's own address
        # logFile: 'D:\dsh-windows-notifier.log'
        #
        # These keys (and the ones above) are also editable at runtime under
        # Settings -> Plugins -> Plugin configuration; a value saved there lives
        # in $DSH_HOME/settings.yaml and wins over this config block.